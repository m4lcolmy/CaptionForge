  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8F03C"/>
      <stop offset="0.55" stop-color="#00D68F"/>
      <stop offset="1" stop-color="#00C2AE"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#ramp)"/>
  <g fill="#052018">
    <rect x="56" y="86" width="144" height="20" rx="10"/>
    <rect x="56" y="126" width="144" height="20" rx="10" opacity="0.72"/>
    <rect x="56" y="166" width="88" height="20" rx="10" opacity="0.45"/>
